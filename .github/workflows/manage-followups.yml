name: Manage PR and issue follow-ups

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write labels, comments, and closures (otherwise dry run)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: manage-followups
  cancel-in-progress: false

jobs:
  manage-followups:
    runs-on: canton-network-cf-docs
    env:
      HAS_MEMBERS_APP: ${{ secrets.FOLLOWUPS_APP_ID != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Org membership is private, so it is read through a GitHub App installed in
      # both employee orgs with organization Members: read. Without the app,
      # membership is unknown and nobody is closed.
      - name: Token for digital-asset members
        id: da-members
        if: ${{ env.HAS_MEMBERS_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FOLLOWUPS_APP_ID }}
          private-key: ${{ secrets.FOLLOWUPS_APP_PRIVATE_KEY }}
          owner: digital-asset
          permission-members: read

      - name: Token for canton-network members
        id: cn-members
        if: ${{ env.HAS_MEMBERS_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FOLLOWUPS_APP_ID }}
          private-key: ${{ secrets.FOLLOWUPS_APP_PRIVATE_KEY }}
          owner: canton-network
          permission-members: read

      # Scheduled runs stay dry until the FOLLOWUPS_APPLY repository variable is
      # set to "true", so the policy can be observed in logs before it acts.
      - name: Manage follow-ups
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_MEMBERS_TOKEN_DIGITAL_ASSET: ${{ steps.da-members.outputs.token }}
          ORG_MEMBERS_TOKEN_CANTON_NETWORK: ${{ steps.cn-members.outputs.token }}
          APPLY: ${{ inputs.apply || vars.FOLLOWUPS_APPLY == 'true' }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$APPLY" = "true" ]; then
            args+=(--apply --slack-payload followups-slack.json)
          fi
          python3 scripts/manage_followups.py "${args[@]}"

      # Docs-team alerts share the workflow-failure channel. The payload file
      # only exists on applied runs that raised an alert.
      - name: Notify docs team in Slack
        if: ${{ !cancelled() && hashFiles('followups-slack.json') != '' }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: followups-slack.json
