name: Manage PR and issue follow-ups

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write labels, comments, and closures (otherwise dry run)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: manage-followups
  cancel-in-progress: false

jobs:
  manage-followups:
    runs-on: canton-network-cf-docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Scheduled runs write to GitHub and Slack. Set the FOLLOWUPS_DRY_RUN
      # repository variable to "true" to pause them without a code change.
      # Manual runs write only when the apply input is checked.
      - name: Manage follow-ups
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ (github.event_name == 'schedule' && vars.FOLLOWUPS_DRY_RUN != 'true') || inputs.apply }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$APPLY" = "true" ]; then
            args+=(--apply --slack-payload followups-slack.json)
          fi
          python3 scripts/manage_followups.py "${args[@]}"

      # Docs-team alerts share the workflow-failure channel. The payload file
      # only exists on applied runs that raised an alert.
      - name: Notify docs team in Slack
        if: ${{ !cancelled() && hashFiles('followups-slack.json') != '' }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: followups-slack.json
