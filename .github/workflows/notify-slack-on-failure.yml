name: Notify Slack on Any Workflow Failure

on:
  workflow_run:
    workflows:
      - "Docs validation"
      - "Mintlify validate"
      - "Pull external Snippet updates"
      - "Sync Daml Prim API from dpm"
      - "Update generated docs"
      - "Validate network variable tabs"
    types:
      - completed

jobs:
  notify-on-failure:
    runs-on: canton-network-cf-docs
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ *${{ github.event.workflow_run.name }}* failed on `${{ github.event.workflow_run.head_branch }}` (triggered by ${{ github.event.workflow_run.actor.login }})\n<${{ github.event.workflow_run.html_url }}|View run>"
            }
