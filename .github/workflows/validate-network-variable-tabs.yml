name: Validate network variable tabs

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-network-variable-tabs:
    runs-on: canton-network-cf-docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Test network rendering and generated-docs automation
        run: |
          python3 -m pip install pytest
          python3 -m pytest tests/test_network_variable_tabs.py tests/test_update_generated_reference_prs.py tests/test_generate_external_snippets.py tests/test_manage_followups.py tests/test_splice_copied_cross_references.py::test_splice_daml_type_links_resolve_to_generated_anchors

      - name: Validate rendered network variable tabs
        run: npm run validate:network-variable-tabs
